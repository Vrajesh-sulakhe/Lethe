[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe"
version = "0.2.0"
description = "Verifiable, Forgetting-Capable Agent Memory Operating System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Vrajesh Sulakhe"},
    {name = "Ajit"},
]
keywords = ["mcp", "agent-memory", "unlearning", "bitemporal", "sqlite", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=7.0.0"]

[project.scripts]
lethe = "lethe.cli:main"
lethe-mcp = "lethe.mcp.server:main"

[tool.setuptools.packages.find]
include = ["lethe*"]

[tool.setuptools.package-data]
"lethe.platform.dashboard" = ["*.html"]


